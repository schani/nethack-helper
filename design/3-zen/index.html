<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetHack — Zen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────
   ZEN · a calm NetHack client
   Semantic colour is scarce on purpose:
     ink        — the game. Solid ink = the game is waiting on you.
     vermilion  — danger only (HP).
     ochre      — caution (hunger, encumbrance).
     indigo     — the assistant's voice (orb, spotlight).
   ────────────────────────────────────────────────────────────── */
:root{
  --paper:#F4F1EA; --paper-hi:#FBFAF6; --sheet:#FDFCF9;
  --ink:#1A1916; --ink-2:#3B3833; --mute:#8A857B; --faint:#B7B1A5; --hair:#E3DED3; --hair-2:#D7D1C4;
  --verm:#C2361F; --ochre:#9C6B00; --indigo:#34497A; --indigo-soft:rgba(52,73,122,.10);
  --cw:15px; --ch:28px; --fs:25px;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  /* NetHack colour indices 0–15, remapped for paper. All ≥3:1 on --paper (glyphs are ≥20px). */
  --c0:#2E2B27;  /* black → true ink (dark-room floor handled separately) */
  --c1:#B42318; --c2:#2F7D32; --c3:#8B5A2B; --c4:#2B4C9B; --c5:#8E3A8E; --c6:#0A6F78; --c7:#706B62;
  --c8:#8F8A80; --c9:#C2540A; --c10:#4E8F12; --c11:#A37800; --c12:#2F6BD6; --c13:#B8358F; --c14:#118E9A; --c15:#1A1916;
  --dark-floor:#C4BEB2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
kbd{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-2);display:inline-block;min-width:20px;padding:1px 5px 0;
    border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:4px;text-align:center;line-height:16px;background:var(--paper-hi)}

/* faint danger vignette (only in danger) */
#vignette{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease);
  box-shadow:inset 0 0 180px rgba(194,54,31,.10)}
body.danger #vignette{opacity:1}

/* the game-is-waiting bar */
#waitbar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);
  transition:transform .28s var(--ease);z-index:30}
body.waiting #waitbar{transform:scaleX(1)}

/* ── column ─────────────────────────────────────────── */
#column{position:absolute;left:50%;top:0;width:calc(80 * var(--cw));transform:translateX(-50%);height:100%;
  display:flex;flex-direction:column;justify-content:center;padding-bottom:30px}

/* game message line */
#msg{height:46px;display:flex;align-items:flex-end;gap:14px;font-family:var(--serif);font-size:20px;line-height:1.3;
  color:var(--ink);letter-spacing:.005em;margin-bottom:22px;font-variation-settings:"opsz" 20}
#msg{position:relative}
#msg .ask{position:absolute;left:0;top:-6px;display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);font-weight:600}
#msg .ask i{width:8px;height:8px;background:var(--ink)}
#msg.question .ask{top:-14px}
#msg .t{transition:opacity .5s var(--ease)}
#msg.question{font-size:27px;font-variation-settings:"opsz" 30}
#msg .choices{display:flex;gap:8px;align-items:center;font-family:var(--sans);font-size:13px;color:var(--mute);margin-left:6px;transform:translateY(-3px)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 7px;border-radius:5px;
  font-family:var(--mono);font-size:15px;font-weight:600;border:1.5px solid var(--ink);color:var(--ink);background:var(--sheet)}
.key.solid{background:var(--ink);color:var(--paper-hi)}
.key.wide{font-size:12px;letter-spacing:.06em}
.choice{display:inline-flex;align-items:center;gap:7px;margin-right:10px;color:var(--ink-2);font-size:14px}
.choice small{color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.more{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  transform:translateY(-3px)}
.more .key{animation:nudge 2.4s var(--ease) infinite}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(3px)}}

/* ── map ─────────────────────────────────────────────── */
#mapwrap{position:relative;height:calc(21 * var(--ch));width:100%;transition:opacity .22s var(--ease), filter .22s var(--ease)}
#map{position:absolute;inset:0;font-family:var(--mono);font-size:var(--fs);line-height:var(--ch)}
#map .g{position:absolute;width:var(--cw);height:var(--ch);text-align:center;font-weight:400;transition:opacity .7s var(--ease), color .7s var(--ease)}
#map .w5{font-weight:500} #map .w6{font-weight:600}
#map .df{color:var(--dark-floor)}
#map .cor{color:#A29C91 !important;font-weight:300}
#map .fl{color:#8F897F !important}
#heroMark{position:absolute;width:calc(var(--cw) * 2.6);height:calc(var(--cw) * 2.6);border-radius:50%;
  background:radial-gradient(circle, rgba(52,73,122,.13) 0%, rgba(52,73,122,.05) 45%, transparent 70%);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .6s}
body.spot #map .g{opacity:.16}
body.spot #map .g.lit{opacity:1}
body.spot #map .g.hero{opacity:1}
#spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s var(--ease)}
body.spot #spot{opacity:1}
#spotUnder{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s var(--ease)}
body.spot #spotUnder{opacity:1}
#spotUnder .halo{position:absolute;width:calc(var(--cw)*5);height:calc(var(--cw)*5);border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.6) 38%, transparent 70%)}
#spot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#spot .ring{fill:none;stroke:var(--indigo);stroke-width:1.25;stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset 1.1s .25s var(--ease)}
body.spot #spot .ring{stroke-dashoffset:0}
#spot .path{fill:none;stroke:var(--indigo);stroke-width:1.2;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.55}
#spot .label{position:absolute;background:rgba(244,241,234,.92);padding:4px 6px;transform:translateY(-50%);white-space:nowrap;font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);
  display:flex;align-items:center;gap:10px}
#spot .label b{font-weight:600}
#spot .label i{font-style:normal;color:var(--mute);letter-spacing:.1em}
#spot .label .rule{width:28px;height:1px;background:var(--indigo);opacity:.5}

/* hover description */
#hover{position:absolute;pointer-events:none;font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;opacity:0;transition:opacity .25s;padding:3px 8px;background:rgba(251,250,246,.92);border-radius:3px;transform:translate(-50%, 4px)}
#hover.on{opacity:1}
#hoverCell{position:absolute;width:var(--cw);height:var(--ch);border-bottom:1.5px solid var(--ink-2);opacity:0;pointer-events:none;transition:opacity .2s}
#hoverCell.on{opacity:.7}

/* ── status whisper ──────────────────────────────────── */
#status{margin-top:22px;position:relative;height:34px;display:grid;grid-template-columns:1fr 34px 1fr;column-gap:30px;align-items:center;font-size:12.5px;color:var(--mute)}
#status .vals{justify-content:flex-end}
#gauge{position:absolute;left:0;right:0;top:-10px;height:1px;background:var(--hair)}
#gauge i{position:absolute;left:0;top:0;height:100%;background:var(--hair-2);transition:width .8s var(--ease), background .8s, height .4s}
body.danger #gauge i{background:var(--verm);height:2px}
#status .who{display:flex;gap:12px;align-items:baseline}
#status .who b{font-weight:500;color:var(--ink-2)}
#status .sep{color:var(--faint)}
#status .vals{display:flex;gap:22px;align-items:baseline}
#status .v{display:flex;gap:6px;align-items:baseline;transition:color .5s}
#status .v span{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#status .v em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
#status .v.hot span{color:var(--verm);font-weight:600}
#status .v.hot em{color:var(--verm);font-size:19px;font-weight:600}
#status .v.warn span,#status .v.warn em{color:var(--ochre)}
#status .cond{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:20px}
#status .cond.ochre{color:var(--ochre);background:rgba(156,107,0,.09)}
#status .cond.ind{color:var(--indigo);background:var(--indigo-soft)}

/* ── voice: orb + captions ───────────────────────────── */
#voice{height:118px;position:relative;margin-top:6px}
#orb{width:34px;height:34px;cursor:pointer}
#orb svg{width:100%;height:100%;overflow:visible}
#orb .enso{fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:72 16;transform-origin:20px 20px;transform:rotate(-70deg);transition:stroke .5s, stroke-dasharray .6s var(--ease)}
#orb .enso2{fill:none;stroke:var(--faint);stroke-width:.8;opacity:.6;stroke-linecap:round;stroke-dasharray:40 48;transform-origin:20px 20px;transform:rotate(30deg)}
#orb .core{fill:var(--faint);transition:fill .5s, r .5s}
#orb .rip{fill:none;stroke:var(--indigo);stroke-width:1;opacity:0}
body.speaking #orb .enso, body.listening #orb .enso, body.writing #orb .enso{stroke:var(--indigo)}
body.writing #orb .core{fill:var(--indigo)}
body.writing #mapwrap{opacity:.45}
body.speaking #orb .enso2{stroke:var(--indigo)}
body.speaking #orb .core, body.listening #orb .core{fill:var(--indigo)}
body.speaking #orb .rip{animation:ripple 2.6s var(--ease) infinite}
body.speaking #orb .rip.b{animation-delay:1.3s}
body.listening #orb .enso{stroke-dasharray:88 0;animation:breathe 2.4s ease-in-out infinite}
@keyframes ripple{0%{r:9;opacity:.45}100%{r:30;opacity:0}}
@keyframes breathe{0%,100%{stroke-width:2.2}50%{stroke-width:3.4}}

#caption{position:absolute;left:50%;top:10px;width:min(980px, 100%);transform:translateX(-50%);text-align:center;pointer-events:none}
#caption .you{font-family:var(--sans);font-size:12.5px;color:var(--mute);letter-spacing:.02em;margin-bottom:6px;opacity:0;transition:opacity .5s}
#caption .you b{font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:10px;margin-right:8px;color:var(--faint)}
#caption .say{font-family:var(--serif);font-size:24px;line-height:1.38;color:var(--ink);font-variation-settings:"opsz" 24;letter-spacing:.003em;text-wrap:balance}
#caption .say .w{opacity:0;filter:blur(3px);display:inline-block;transform:translateY(4px);transition:opacity .45s var(--ease), filter .45s var(--ease), transform .45s var(--ease)}
#caption .say .w.in{opacity:1;filter:none;transform:none}
#caption .say .ref{border-bottom:1px dotted var(--indigo);color:var(--indigo)}
#caption .src{margin-top:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);opacity:0;transition:opacity .6s .3s}
#caption .src b{color:var(--mute);font-weight:500}
#caption.on .you, #caption.on .src{opacity:1}
#caption.fade{opacity:0;transition:opacity 1.2s var(--ease)}
.spoiler{display:inline-flex;gap:8px;align-items:center;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre);
  border:1px solid rgba(156,107,0,.35);padding:3px 10px;border-radius:20px;margin-left:10px;vertical-align:middle;transform:translateY(-2px)}

/* write box (F2) */
#write{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:680px;opacity:0;pointer-events:none;transition:opacity .2s}
body.writing #write{opacity:1}
#write .box{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--indigo);padding:6px 2px 8px}
#write .box span{font-family:var(--serif);font-size:23px;color:var(--ink)}
#write .caret{width:1.5px;height:26px;background:var(--indigo);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#write .hint{margin-top:8px;display:flex;justify-content:space-between;font-size:11px;color:var(--mute);letter-spacing:.04em}

/* ── key legend ───────────────────────────────────────── */
#legend{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:20px;font-size:11px;color:var(--mute);letter-spacing:.03em;transition:opacity .4s}
#legend span{display:inline-flex;gap:6px;align-items:center}
#legend span.on{color:var(--ink)}
#legend span.on kbd{border-color:var(--ink);color:var(--ink)}
#focus{position:fixed;right:28px;bottom:19px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
#focus i{width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
body.writing #focus{color:var(--indigo)} body.writing #focus i{background:var(--indigo)}
#where{position:fixed;left:28px;bottom:19px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* ── calm overlays (F-keys) ──────────────────────────── */
body.sheeted #mapwrap{opacity:.07;filter:blur(1.5px)}
body.sheeted #msg, body.sheeted #status, body.sheeted #voice{opacity:.12}
#msg,#status{transition:opacity .22s var(--ease)}
#sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,calc(-50% + 10px));opacity:0;pointer-events:none;
  transition:opacity .16s var(--ease), transform .2s var(--ease);background:var(--sheet);border:1px solid var(--hair);border-radius:3px;
  box-shadow:0 40px 90px -30px rgba(60,45,20,.22), 0 2px 6px rgba(60,45,20,.04);max-height:calc(100vh - 120px);display:flex;flex-direction:column;z-index:20}
body.sheeted #sheet{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
#tabs{display:flex;gap:2px;padding:16px 28px 0;border-bottom:1px solid var(--hair)}
#tabs div{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 12px 12px;display:flex;gap:8px;align-items:center;border-bottom:1.5px solid transparent;margin-bottom:-1px}
#tabs div kbd{font-size:9.5px;min-width:18px;line-height:14px;color:var(--faint);border-color:var(--hair)}
#tabs div.on{color:var(--ink);border-bottom-color:var(--ink)}
#tabs div.on kbd{color:var(--ink);border-color:var(--ink-2)}
#sheetHead{padding:26px 40px 6px;display:flex;justify-content:space-between;align-items:baseline}
#sheetHead h2{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.005em;font-variation-settings:"opsz" 48}
#sheetHead .meta{font-size:12px;color:var(--mute);letter-spacing:.03em}
#sheetBody{padding:8px 40px 18px;overflow:auto}
#sheetFoot{padding:14px 40px 16px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);align-items:center}
#sheetFoot span{display:inline-flex;gap:7px;align-items:center;margin-right:18px}

.invcols{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.grp{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:20px 0 4px;display:flex;align-items:center;gap:12px}
.grp:after{content:"";flex:1;height:1px;background:var(--hair)}
.inv{display:grid;grid-template-columns:24px 22px 1fr auto;align-items:baseline;column-gap:14px;padding:7px 0;border-bottom:1px solid transparent}
.inv .l{font-family:var(--mono);font-size:14px;color:var(--mute);text-align:right}
.inv .s{font-family:var(--mono);font-size:19px;font-weight:500;text-align:center}
.inv .n{font-family:var(--serif);font-size:18.5px;color:var(--ink);font-variation-settings:"opsz" 18}
.inv .n .called{font-style:italic;color:var(--indigo)}
.inv .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.inv .tag.u{color:var(--faint)}
.inv .tag.use{color:var(--ink-2)}

/* transcript */
.tr{display:grid;grid-template-columns:64px 1fr 210px;column-gap:24px;padding:12px 0}
.tr .t{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:5px}
.tr .you{font-size:14px;color:var(--mute)}
.tr .you:before{content:"You  ";font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.tr .a{font-family:var(--serif);font-size:19.5px;line-height:1.45;color:var(--ink);font-variation-settings:"opsz" 18}
.tr .note{font-size:11.5px;line-height:1.5;color:var(--mute);border-left:1px solid var(--hair-2);padding-left:12px}
.tr .note b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);font-weight:600;margin-bottom:2px}
.tr .note code{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.gate{margin-top:8px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ochre)}
.gate .bar{flex:0 0 auto;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid rgba(156,107,0,.35);border-radius:20px;padding:3px 10px}

/* levels */
.spine{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.spine .grp{margin-top:6px}
.lv{display:grid;grid-template-columns:34px 220px 1fr;column-gap:18px;align-items:center;padding:9px 0}
.lv .d{font-family:var(--serif);font-size:26px;color:var(--mute);text-align:right;font-variation-settings:"opsz" 40}
.lv canvas{display:block;background:#F7F5EF;border-radius:2px;outline:1px solid var(--hair)}
.lv .info{font-size:12.5px;color:var(--mute);line-height:1.55}
.lv .info b{display:block;font-family:var(--serif);font-weight:400;font-size:18px;color:var(--ink);font-variation-settings:"opsz" 18}
.lv.here .d{color:var(--indigo)}
.lv.here canvas{outline:1.5px solid var(--indigo);outline-offset:3px}
.lv .pill{display:inline-block;margin-top:4px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);padding:2px 8px;border-radius:20px}
.mines .branch{height:calc((220px / 80 * 1.86 * 21 + 18px) * 2);margin-left:52px;position:relative}
.mines .branch:before{content:"";position:absolute;left:0;top:62%;bottom:0;border-left:1px dashed var(--faint)}
.mines .branch:after{content:"";position:absolute;left:-56px;right:auto;width:56px;top:62%;border-top:1px dashed var(--faint)}
.mines .branch i{position:absolute;left:14px;top:62%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--mute);letter-spacing:.04em}
.msgs .m{display:grid;grid-template-columns:54px 1fr;padding:6px 0;font-family:var(--serif);font-size:18px;color:var(--ink-2)}
.msgs .m span{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:5px}
.disc{columns:2;column-gap:40px;font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.disc div{padding:3px 0;break-inside:avoid}
.disc .h{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:12px}
.disc i{color:var(--mute)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0 10px}
.attrs div{text-align:center;padding:14px 0;border-top:1px solid var(--hair)}
.attrs b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;font-variation-settings:"opsz" 60}
.attrs span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}

/* ── game prompts: unmistakable ──────────────────────── */
body.menu #mapwrap{opacity:.32}
body.yn #mapwrap{opacity:.5}
body.menu #status, body.menu #msg{opacity:.4}
#gmenu{position:absolute;top:calc(50% - 300px);left:50%;transform:translate(-50%,8px);min-width:560px;background:#FFFEFB;border:2px solid var(--ink);
  box-shadow:0 30px 70px -30px rgba(30,25,15,.45);opacity:0;pointer-events:none;transition:opacity .16s var(--ease), transform .2s var(--ease);z-index:15}
body.menu #gmenu{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#gmenu .hd{padding:18px 26px 14px;border-bottom:1px solid var(--hair)}
#gmenu .lbl{display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);font-weight:600}
#gmenu .lbl i{width:8px;height:8px;background:var(--ink)}
#gmenu h3{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:28px;font-variation-settings:"opsz" 36}
#gmenu .items{padding:10px 14px}
#gmenu .it{display:flex;align-items:center;gap:16px;padding:7px 12px;border-radius:3px;font-size:16.5px;color:var(--ink)}
#gmenu .it .key{min-width:30px;height:30px}
#gmenu .it.sel{background:#F1EDE3}
#gmenu .it .sg{margin-left:auto;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);padding:3px 9px;border-radius:20px}
#gmenu .it.sugg{box-shadow:inset 2px 0 0 var(--indigo)}
#gmenu .it.sel .key{background:var(--ink);color:var(--paper-hi)}
#gmenu .ft{padding:12px 26px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
#gmenu .ft span{display:inline-flex;gap:7px;align-items:center;margin-right:16px}

/* ── demo switcher (not part of the design) ─────────── */
#demo{position:fixed;top:12px;right:14px;display:flex;gap:2px;font-size:11px;z-index:50;background:rgba(255,255,255,.7);border:1px solid var(--hair);border-radius:20px;padding:3px}
#demo button{all:unset;cursor:pointer;padding:4px 9px;border-radius:20px;color:var(--mute)}
#demo button.on{background:var(--ink);color:var(--paper-hi)}
body.shot #demo{display:none}

@media (prefers-reduced-motion: reduce){ *{transition-duration:0s !important;animation:none !important} }

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const body = document.body;
let CW = 15, CH = 28;

/* ── layout: fit 80×21 into the viewport, generous margins ── */
function fit(){
  const W = innerWidth, H = innerHeight;
  const byW = (W - 200) / 80, byH = (H - 345) / 21 / 1.86;
  CW = Math.max(10, Math.floor(Math.min(byW, byH)));
  CH = Math.round(CW * 1.86);
  const r = document.documentElement.style;
  r.setProperty('--cw', CW + 'px'); r.setProperty('--ch', CH + 'px'); r.setProperty('--fs', (CW / 0.6).toFixed(2) + 'px');
}

/* ── map ── */
const BRIGHT = new Set([9,10,11,12,13,14]);
let cellIndex = {};
function renderMap(fx){
  const map = $('#map'); map.innerHTML = ''; cellIndex = {};
  const [hx, hy] = fx.hero;
  for (const [x, y, ch, col, desc] of fx.level.cells){
    const s = document.createElement('span');
    s.className = 'g';
    s.textContent = ch;
    s.style.left = (x * CW) + 'px'; s.style.top = (y * CH) + 'px';
    if (desc === 'dark part of a room') s.classList.add('df');
    else {
      s.style.color = `var(--c${col})`;
      if (col === 15 || col === 0) s.classList.add(/[a-zA-Z@&;:']/.test(ch) ? 'w6' : 'w5');
      else if (col !== 7 && col !== 8) s.classList.add('w5');
      if (col === 7 && desc === 'corridor') s.classList.add('cor');
      if (col === 7 && ch === '.') s.classList.add('fl');
    }
    if (x === hx && y === hy) s.classList.add('hero');
    s.dataset.k = x + ',' + y;
    map.appendChild(s);
    cellIndex[x + ',' + y] = {el: s, desc, ch};
  }
  const hm = $('#heroMark');
  hm.style.left = ((hx + .5) * CW) + 'px'; hm.style.top = ((hy + .5) * CH) + 'px';
}

/* hover → per-tile description */
function showHover(x, y){
  const c = cellIndex[x + ',' + y], hv = $('#hover'), hc = $('#hoverCell');
  if (!c || c.desc === 'dark part of a room' && false){ hv.classList.remove('on'); hc.classList.remove('on'); return; }
  hv.textContent = c.desc;
  hv.style.left = ((x + .5) * CW) + 'px'; hv.style.top = ((y + 1) * CH) + 'px';
  hc.style.left = (x * CW) + 'px'; hc.style.top = (y * CH) + 'px';
  hv.classList.add('on'); hc.classList.add('on');
}
$('#mapwrap').addEventListener('mousemove', e => {
  const r = $('#map').getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / CW), y = Math.floor((e.clientY - r.top) / CH);
  if (cellIndex[x + ',' + y]) showHover(x, y); else { $('#hover').classList.remove('on'); $('#hoverCell').classList.remove('on'); }
});
$('#mapwrap').addEventListener('mouseleave', () => { $('#hover').classList.remove('on'); $('#hoverCell').classList.remove('on'); });

/* spotlight: dim everything but the tile the assistant is talking about */
function spotlight(fx, x, y, name, note){
  for (const k in cellIndex) cellIndex[k].el.classList.remove('lit');
  if (x == null){ body.classList.remove('spot'); return; }
  cellIndex[x + ',' + y]?.el.classList.add('lit');

  ring.style.strokeDasharray = ring.style.strokeDashoffset = (2 * Math.PI * CW * 1.25).toFixed(1);
  // dotted path from hero to target, stopping short of both
  const dx = cx - hxp, dy = cy - hyp, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const a = CW * 1.0, b = CW * 1.45;
  sp.querySelector('.path').setAttribute('d', `M${hxp + ux * a},${hyp + uy * a} L${cx - ux * b},${cy - uy * b}`);
  const lab = sp.querySelector('.label');
  const leftSide = x > 52;
  lab.innerHTML = leftSide ? `<span><b>${name}</b> &nbsp;<i>${note}</i></span><span class="rule"></span>` : `<span class="rule"></span><span><b>${name}</b> &nbsp;<i>${note}</i></span>`;
  lab.style.top = cy + 'px';
  if (leftSide){ lab.style.left = 'auto'; lab.style.right = (80 * CW - cx + CW * 1.9) + 'px'; }
  else { lab.style.right = 'auto'; lab.style.left = (cx + CW * 1.9) + 'px'; }
  requestAnimationFrame(() => { body.classList.add('spot'); requestAnimationFrame(() => ring.style.strokeDashoffset = 0); });
}

/* ── message line ── */
function renderMsg(fx, mode){
  const m = $('#msg'); m.className = ''; m.innerHTML = '';
  const aw = fx.awaiting || {};
  if (mode === 'yn'){
    const q = fx.messages[fx.messages.length - 1].text.trim();
    const mm = q.match(/^(.*?)\s*\[(\w+)\]\s*\((\w)\)$/);
    m.className = 'question';
    const lbl = {y:'yes', n:'no', q:'quit', a:'all'};
    m.innerHTML = `<span class="ask"><i></i>The game asks</span><span class="t">${mm[1]}</span><span class="choices">` +
      [...mm[2]].map(c => `<span class="choice"><span class="key ${c === mm[3] ? 'solid' : ''}">${c}</span>${lbl[c] || c}${c === mm[3] ? ' <small>default</small>' : ''}</span>`).join('') + `</span>`;
    return;
  }
  if (mode === 'more'){
    m.className = 'waits';
    m.innerHTML = `<span class="ask"><i></i>The game waits</span><span class="t">${aw.prompt.replace(/  /g, '&ensp; ')}</span><span class="more"><span class="key solid wide">↵</span>more</span>`;
    return;
  }
  const last = fx.messages.filter(x => x.turn >= fx.turn - 1 && x.turn > 1 && x.text.trim() !== '#');
  const txt = last.map(x => x.text.trim()).join('  ');
  m.innerHTML = `<span class="t">${(txt || '').replace(/  /g, '&ensp; ')}</span>`;
}

/* ── status whisper ── */
function renderStatus(fx, opts = {}){
  const f = fx.status, st = $('#status');
  const hp = +f.hp, hpm = +f.hp_max, frac = hp / hpm, hot = frac < 1 / 3;
  body.classList.toggle('danger', hot);
  $('#gauge i').style.width = (frac * 100) + '%';
  const lvl = fx.level, dname = lvl.dungeon.replace('The ', '');
  const who = st.querySelector('.who');
  who.innerHTML = `<b>${f.title}</b><span class="sep">·</span><span>${f.level_desc.replace(':', ' ')}</span><span class="sep">·</span><span>${dname}</span>`;
  const conds = [];
  if (f.hunger) conds.push(`<span class="cond ochre">${f.hunger}</span>`);
  (fx.conditions || []).forEach(c => conds.push(`<span class="cond ind">${c}</span>`));
  const v = (k, val, cls = '') => `<div class="v ${cls}"><span>${k}</span><em>${val}</em></div>`;
  const vals = st.querySelector('.vals');
  vals.innerHTML = conds.join('') +
    v('HP', `${hp}<span style="font-size:.8em;opacity:.6">/${hpm}</span>`, hot ? 'hot' : '') + v('Pw', `${f.power}/${f.power_max}`) + v('AC', f.ac) +
    v('Xp', f.xp_level) + v('$', f.gold) + v('T', f.time);
}

/* ── captions: words arrive like speech, then fade ── */
let capTimers = [];
function clearCaption(){ capTimers.forEach(clearTimeout); capTimers = []; const c = $('#caption'); c.className = ''; c.querySelector('.say').innerHTML = ''; c.querySelector('.you').innerHTML = ''; c.querySelector('.src').innerHTML = ''; body.classList.remove('speaking'); }
function caption({you, say, src, instant}){
  clearCaption();
  const c = $('#caption');
  if (you) c.querySelector('.you').innerHTML = `<b>you</b>“${you}”`;
  if (src) c.querySelector('.src').innerHTML = src;
  const sayEl = c.querySelector('.say');
  // say is HTML-ish: split on spaces but keep tags (<span class=ref>…</span> kept as one token group)
  const tokens = say.match(/<[^>]+>[^<]*<\/[^>]+>[^\s]*|\S+/g);
  sayEl.innerHTML = tokens.map(t => `<span class="w">${t}</span>`).join(' ');
  body.classList.add('speaking');
  c.classList.add('on');
  const ws = [...sayEl.querySelectorAll('.w')];
  if (instant){ ws.forEach(w => w.classList.add('in')); return; }
  ws.forEach((w, i) => capTimers.push(setTimeout(() => w.classList.add('in'), 180 + i * 165)));
}

/* ── overlays ── */
const TABS = [['F3','Transcript','transcript'],['F4','Inventory','inventory'],['F6','Messages','messages'],['F7','Levels','levels'],['F8','Discoveries','discoveries'],['F9','Self','self']];
const PACK = '")[%?+!=/(*`0_';
const CLASSN = {'"':'Amulets', ')':'Weapons', '[':'Armor', '%':'Comestibles', '?':'Scrolls', '+':'Spellbooks', '!':'Potions', '=':'Rings', '/':'Wands', '(':'Tools', '*':'Gems'};
const SYMCOL = {')':'var(--c6)', '[':'var(--c3)', '%':'var(--c3)', '!':'var(--c5)', '?':'var(--c15)', '=':'var(--c11)', '/':'var(--c4)', '"':'var(--c9)', '(':'var(--c3)', '+':'var(--c4)'};
let sheetFx = null;

function openSheet(kind, fx){
  sheetFx = fx;
  body.classList.add('sheeted');
  $('#tabs').innerHTML = TABS.map(([k, n, id]) => `<div class="${id === kind ? 'on' : ''}"><kbd>${k}</kbd>${n}</div>`).join('');
  const sh = $('#sheet'), H = $('#sheetHead'), B = $('#sheetBody'), F = $('#sheetFoot');
  const close = `<span><kbd>Esc</kbd> or <kbd>${TABS.find(t => t[2] === kind)[0]}</kbd> close</span>`;
  sh.style.width = '980px';
  if (kind === 'inventory'){
    const inv = [...fx.inventory].sort((a, b) => PACK.indexOf(a.class_sym) - PACK.indexOf(b.class_sym));
    let html = '<div class="invcols"><div>', cur = '', n = 0;
    const half = Math.ceil(inv.length / 2);
    for (const it of inv){
      if (it.class_sym !== cur){ cur = it.class_sym; if (n >= half - 1 && !html.includes('</div><div>')) html += '</div><div>'; html += `<div class="grp">${CLASSN[cur] || it.class}</div>`; }
      n++;
      let t = it.text, tag = '', tagc = '';
      const pm = t.match(/^(.*?)\s*\((.*)\)$/); if (pm){ t = pm[1]; tag = pm[2]; tagc = 'use'; }
      t = t.replace(/^(a|an) /, '');
      const unk = !/ of |corpse|ration|spear|dagger|shield/.test(t) && /[!?=/"+]/.test(it.class_sym);
      t = t.replace(/called (.*)$/, 'called <span class="called">$1</span>');
      if (!tag && unk){ tag = 'unidentified'; tagc = 'u'; }
      html += `<div class="inv"><span class="l">${it.letter}</span><span class="s" style="color:${SYMCOL[it.class_sym] || 'var(--ink)'}">${it.class_sym}</span><span class="n">${t}</span><span class="tag ${tagc}">${tag.replace('weapon in right hand','wielded · right hand').replace('alternate weapon; not wielded','alternate').replace('being worn','worn')}</span></div>`;
    }
    html += '</div></div>';
    H.innerHTML = `<h2>Inventory</h2><span class="meta">${fx.inventory.length} items &nbsp;·&nbsp; $${fx.status.gold} &nbsp;·&nbsp; unencumbered</span>`;
    B.innerHTML = html;
    F.innerHTML = `<div>${close}</div><div>Game keys pass through — press <kbd>q</kbd> and this stays open while the game asks what to drink</div>`;
  }
  if (kind === 'transcript'){
    sh.style.width = '940px';
    H.innerHTML = `<h2>Conversation</h2><span class="meta">this game · Agnes the Valkyrie · 6 exchanges</span>`;
    B.innerHTML = TRANSCRIPT.map(r => `<div class="tr"><span class="t">${r.t || ''}</span><div>${r.you ? `<div class="you">${r.you}</div>` : ''}${r.a ? `<div class="a">${r.a}</div>` : ''}${r.gate ? `<div class="gate"><span class="bar">spoiler withheld</span>${r.gate}</div>` : ''}</div><div>${r.note ? `<div class="note">${r.note}</div>` : ''}</div></div>`).join('');
    F.innerHTML = `<div>${close}<span><kbd>F2</kbd> write</span><span><kbd>F1</kbd> hold to speak</span></div><div>Lookups appear in the margin, never in the captions</div>`;
  }
  if (kind === 'levels'){
    const L = D['deep-dlvl4'];
    sh.style.width = '1040px';
    H.innerHTML = `<h2>Levels</h2><span class="meta">5 remembered &nbsp;·&nbsp; ask “how do I get back to the Mines?”</span>`;
    const notes = {'0:1':['Arrival','Fountain room · up stairs'], '0:2':['Mines branch','Second down-stair leads to the Mines'], '2:1':['Mines, first level','Dark, barely explored'], '0:3':['General store','Shopkeeper peaceful'], '0:4':['Scroll shop','You are here']};
    const card = k => { const lv = L.levels.find(l => l.key === k), n = notes[k], here = k === L.current;
      return `<div class="lv ${here ? 'here' : ''}"><div class="d">${lv.depth}</div><canvas data-k="${k}"></canvas><div class="info"><b>${n[0]}</b>${here ? '<span class="pill">you are here</span>' : n[1]}</div></div>`; };
    B.innerHTML = `<div class="spine"><div class="col"><div class="grp">The Dungeons of Doom</div>${['0:1','0:2','0:3','0:4'].map(card).join('')}</div>
      <div class="col mines"><div class="grp">The Gnomish Mines</div><div class="branch"><i>down-stair from Dlvl 2 · second “>” on the level</i></div>${card('2:1')}</div></div>`;
    B.querySelectorAll('canvas').forEach(cv => drawThumb(cv, L.levels.find(l => l.key === cv.dataset.k), k => k === L.current ? L.hero : null));
    F.innerHTML = `<div>${close}</div><div>Remembered exactly as last seen — the assistant reads the same maps</div>`;
  }
  if (kind === 'messages'){
    H.innerHTML = `<h2>Messages</h2><span class="meta">${fx.messages.length} this session</span>`;
    B.innerHTML = `<div class="msgs">` + fx.messages.slice().reverse().map(m => `<div class="m"><span>T ${m.turn}</span>${m.text}</div>`).join('') + `</div>`;
    F.innerHTML = `<div>${close}</div><div>Newest first</div>`;
  }
  if (kind === 'discoveries'){
    const dd = D['deep-dlvl4'].discoveries.slice(2);
    H.innerHTML = `<h2>Discoveries</h2><span class="meta">Valkyries know their weapons and armour</span>`;
    B.innerHTML = `<div class="disc">` + dd.map(l => /^\*|^ /.test(l) ? `<div>${l.replace(/^[* ] /, '').replace(/\((.*)\)/, '<i>· $1</i>')}</div>` : `<div class="h">${l}</div>`).join('') + `</div>`;
    F.innerHTML = `<div>${close}</div><div>* pre-identified for your role</div>`;
  }
  if (kind === 'self'){
    const f = fx.status;
    H.innerHTML = `<h2>${f.title}</h2><span class="meta">${fx.game.alignment} ${fx.game.race} ${fx.game.role}</span>`;
    B.innerHTML = `<div class="attrs">` + [['St', f.str], ['Dx', f.dex], ['Co', f.con], ['In', f.int], ['Wi', f.wis], ['Ch', f.cha]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('') + `</div>`;
    F.innerHTML = `<div>${close}</div><div>Attributes only surface on the status line when they change</div>`;
  }
  $('#legend').querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.k === TABS.find(t => t[2] === kind)[0]));
}
function closeSheet(){ body.classList.remove('sheeted'); $('#legend').querySelectorAll('span').forEach(s => s.classList.remove('on')); }

function drawThumb(cv, lv, heroOf){
  const w = 220, cw = w / 80, chh = cw * 1.86, h = Math.round(chh * 21);
  const dpr = devicePixelRatio || 1; cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const col = i => css.getPropertyValue('--c' + i).trim();
  for (const [x, y, ch, c, desc] of lv.cells){
    const px = x * cw, py = y * chh;
    if (ch === '.' ){ g.fillStyle = desc === 'dark part of a room' ? '#DCD7CC' : '#CFC9BC'; g.fillRect(px + cw * .3, py + chh * .4, cw * .4, chh * .2); }
    else if (ch === '#'){ g.fillStyle = '#D8D2C6'; g.fillRect(px + cw * .15, py + chh * .3, cw * .7, chh * .4); }
    else if ((ch === '-' || ch === '|') && desc === 'wall'){ g.fillStyle = '#9D978C'; if (ch === '-') g.fillRect(px, py + chh * .5 - .5, cw, 1); else g.fillRect(px + cw * .5 - .5, py, 1, chh); }
    else { g.fillStyle = col(c === 7 ? 15 : c); g.font = `600 ${chh * 1.05}px IBM Plex Mono`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, px + cw / 2, py + chh / 2 + .5); }
  }
  const hero = heroOf(lv.key);
  if (hero){ g.fillStyle = 'rgba(52,73,122,.18)'; g.beginPath(); g.arc((hero[0] + .5) * cw, (hero[1] + .5) * chh, 7, 0, 7); g.fill(); }
}

/* ── game menu ── */
function renderMenu(fx){
  const m = fx.menu;
  $('#gmenu').style.top = ($('#mapwrap').offsetTop + CH * 0.6) + 'px';
  $('#gmenu').innerHTML = `<div class="hd"><div class="lbl"><i></i>The game asks</div><h3>${m.prompt}</h3></div>
    <div class="items">${m.items.map((it, i) => `<div class="it ${i === 2 ? 'sugg' : ''}"><span class="key">${it.ch}</span>${it.text}${i === 2 ? '<span class="sg">assistant suggests</span>' : ''}</div>`).join('')}</div>
    <div class="ft"><div><span>pick one</span><span><kbd>Esc</kbd> cancel</span></div><div>page ${m.items[0].page} of ${m.pages}</div></div>`;
}

/* ── content ── */
const TRANSCRIPT = [
  {t:'T 1', a:'Hi Agnes. Neutral human Valkyrie, Dlvl 1 — your kitten’s right beside you.'},
  {t:'T 3', you:'Who’s the other at-sign?', a:'That’s Hebiwerie, the shopkeeper — two up and one left, by the door. She’s peaceful.', note:'<b>map</b>Tile 74,13 · “peaceful Hebiwerie”'},
  {t:'T 3', you:'What’s this potion I’m on?', a:'A fizzy potion — unidentified. She’s asking 333 for it.', note:'<b>under foot</b>a fizzy potion (for sale, 333 zorkmids)'},
  {t:'T 3', you:'Is that a fair price?', a:'The price says something about what it is. That’s a mild spoiler — want it?', gate:'Price identification · say “go ahead” or press F2 and type it'},
  {t:'T 3', you:'Go ahead.', a:'With your Charisma of 8 she adds a third. So the base is 250 — acid or oil. Not worth it yet.', note:'<b>wiki</b>Price identification — Cha 6–10: +⅓<br><b style="margin-top:8px">wiki</b>Potion — 250 zm: acid, oil<br><b style="margin-top:8px">source</b><code>shk.c · get_cost()</code>'},
  {t:'T 3', you:'Any other shops here?', a:'Just this general store on Dlvl 3. Want me to mark the fountains instead?', note:'<b>overview</b>Level 3: A general store, many fountains.'},
];

const STATES = {
  play:       {fx:'shop', label:'play'},
  speak:      {fx:'shop', label:'assistant'},
  danger:     {fx:'low-hp', label:'danger'},
  inventory:  {fx:'unid-items', label:'F4 inventory', sheet:'inventory'},
  menu:       {fx:'menu-open', label:'game menu', menu:true},
  yn:         {fx:'fountain-quaff-prompt', label:'y/n', yn:true},
  more:       {fx:'more-prompt', label:'--More--', more:true},
  transcript: {fx:'shop', label:'F3 transcript', sheet:'transcript'},
  levels:     {fx:'deep-dlvl4', label:'F7 levels', sheet:'levels'},
  write:      {fx:'shop', label:'F2 write', write:true},
};
let current = 'play', curFx = null;

function setState(name, opts = {}){
  current = name; const S = STATES[name]; const fx = D[S.fx]; curFx = fx;
  body.className = body.className.split(' ').filter(c => c === 'shot').join(' ');
  clearCaption(); closeSheet(); body.classList.remove('spot');
  renderMap(fx); renderStatus(fx);
  renderMsg(fx, S.yn ? 'yn' : S.more ? 'more' : '');
  $('#where').textContent = fx.level.long;
  $('#focus span').textContent = 'keys → game';
  if (S.yn || S.more || S.menu) body.classList.add('waiting');
  if (S.yn) body.classList.add('yn');
  if (S.menu){ renderMenu(fx); body.classList.add('menu'); }
  if (S.sheet) openSheet(S.sheet, fx);
  const inst = !!opts.instant;
  if (name === 'play'){ if (opts.hover) showHover(74, 16); }
  if (name === 'speak'){
    spotlight(fx, 73, 13, 'Hebiwerie', 'shopkeeper · peaceful');
    caption({you:'who’s the other at-sign?', say:'That’s <span class="ref">Hebiwerie</span>, the shopkeeper — two up and one left, by the door. She’s peaceful.', src:'from <b>the map</b> · tile 74,13', instant:inst});
    if (!inst) runSequence([
      [5200, () => caption({say:'Pick things up freely. Just pay before you walk out.', src:'from <b>the wiki</b> · Shopkeeper'})],
      [9800, () => { spotlight(fx, null); caption({say:'Want her prices decoded? That edges into spoiler territory. <span class="spoiler">spoiler · say “go ahead”</span>'}); }],
      [15500, () => { $('#caption').classList.add('fade'); body.classList.remove('speaking'); }],
    ]);
  }
  if (name === 'danger'){
    spotlight(fx, 30, 13, 'jackal', 'hostile · adjacent');
    caption({say:'Four hit points. Don’t pray yet — it’s far too early this game. The <span class="ref">jackal</span>’s up-right; one good hit drops it.', src:'from <b>status</b> · <b>the map</b> · prayer timeout', instant:inst});
  }
  if (name === 'menu'){
    caption({you:'which one?', say:'Press <span class="ref">o</span> — it names every scroll labeled ASHPD SODALG, not just this one.', src:'from <b>the menu</b>', instant:inst});
  }
  if (name === 'yn'){
    caption({you:'should I?', say:'Usually nothing happens. Sometimes water moccasins, or a water demon — risky at eleven hit points.', src:'from <b>the wiki</b> · Fountain', instant:inst});
  }
  if (name === 'more'){
    caption({say:'That was far too soon to pray. Anhur won’t be pleased — brace yourself.', src:'from <b>messages</b> · prayer timeout', instant:inst});
  }
  if (name === 'write'){
    body.classList.add('writing');
    $('#wtext').textContent = 'how much would the bow cost if I sold it back';
    $('#focus span').textContent = 'keys → assistant · Esc returns';
  }
  if (name === 'transcript' || name === 'levels' || name === 'inventory') {}
  document.querySelectorAll('#demo button').forEach(b => b.classList.toggle('on', b.dataset.s === name));
}
let seqTimers = [];
function runSequence(steps){ seqTimers.forEach(clearTimeout); seqTimers = steps.map(([t, f]) => setTimeout(() => { if (current === 'speak') f(); }, t)); }

/* ── legend ── */
$('#legend').innerHTML = [['F1','speak'],['F2','write'],['F3','transcript'],['F4','inventory'],['F6','messages'],['F7','levels'],['F8','discoveries'],['F9','self']]
  .map(([k, n]) => `<span data-k="${k}"><kbd>${k}</kbd>${n}</span>`).join('');

/* ── demo switcher ── */
$('#demo').innerHTML = Object.entries(STATES).map(([k, s]) => `<button data-s="${k}">${s.label}</button>`).join('');
$('#demo').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setState(b.dataset.s); });

/* ── keyboard: F-keys are ours, everything else belongs to the game ── */
addEventListener('keydown', e => {
  const map = {F3:'transcript', F4:'inventory', F6:'messages', F7:'levels', F8:'discoveries', F9:'self'};
  if (map[e.key]){
    e.preventDefault();
    if (body.classList.contains('sheeted') && $('#tabs .on')?.textContent.includes(TABS.find(t => t[0] === e.key)[1])) closeSheet();
    else openSheet(map[e.key], curFx);
    return;
  }
  if (e.key === 'F1'){ e.preventDefault(); if (!e.repeat){ clearCaption(); body.classList.add('listening'); $('#caption .you').innerHTML = '<b>listening</b>release F1 to send'; $('#caption').classList.add('on'); } return; }
  if (e.key === 'F2'){ e.preventDefault(); setState('write'); return; }
  if (e.key === 'Escape'){
    if (body.classList.contains('sheeted')){ closeSheet(); e.preventDefault(); return; }
    if (body.classList.contains('writing')){ setState('play'); e.preventDefault(); return; }
  }
  // any other key would go to the game; an open sheet stays (it's read-only) — demo: nothing else happens
});
addEventListener('keyup', e => { if (e.key === 'F1'){ body.classList.remove('listening'); setState('speak'); } });

fit();
const qs = new URLSearchParams(location.search);
if (qs.has('shot')) body.classList.add('shot');
addEventListener('resize', () => { fit(); setState(current, {instant:true}); });
setState(qs.get('s') || location.hash.slice(1) || 'play', {instant: qs.has('shot'), hover: qs.has('hover')});
</script>
