<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetHack 5 · Mission Control (design proposal 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#E7E6E1; --panel:#FBFBF9; --paper:#FCFBF7; --well:#F2F1EC;
  --line:#CFCCC4; --line2:#E2E0D9; --line3:#EDEBE5;
  --ink:#16161A; --ink2:#46433D; --ink3:#7A766D; --ink4:#A8A49A; --ink5:#C9C5BC;
  --caution:#A86400; --caution-hi:#E89B1E; --caution-bg:#FFF1D2; --caution-line:#EBC27A;
  --warn:#C42420; --warn-bg:#FDE6E2; --warn-line:#F0A39B;
  --pet:#2C7A31; --pet-bg:#E1F0DF;
  --peace:#3B5A9A; --peace-bg:#E3E9F5;
  --comms:#2A3BB8; --comms-bg:#EBEDFB; --comms-line:#B9C0EE;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --cw:9.25px; --rh:18.5px; --mfs:15.4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font-family:var(--sans);font-size:12px;
  -webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
#app{height:100vh;min-height:760px;display:grid;grid-template-rows:46px 1fr 26px}

/* ───────── header ───────── */
#top{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line)}
#top>div{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line2)}
#top>div:last-child{border-right:0}
.brand{width:26px;height:26px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 11px/1 var(--mono);letter-spacing:-.04em;margin-right:12px}
.who .name{font-weight:700;font-size:14px;letter-spacing:-.01em}
.who .sub{color:var(--ink3);font-size:11px;margin-top:1px}
.readouts{gap:0;padding:0!important}
.ro{display:flex;flex-direction:column;justify-content:center;padding:0 16px;height:100%;border-right:1px solid var(--line3)}
.ro label,.lbl{font:600 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.ro span{font:600 17px/1.1 var(--mono);letter-spacing:-.02em;margin-top:3px}
.ro span small{font:500 11px var(--sans);color:var(--ink3);letter-spacing:0;margin-left:6px}
.lamps{gap:6px}
.lamp{font:700 10px/1 var(--sans);letter-spacing:.1em;padding:7px 9px;border:1px solid var(--line);color:var(--ink5);background:var(--well);min-width:86px;text-align:center}
.lamp b{display:block;font:600 9.5px/1 var(--mono);letter-spacing:0;margin-top:3px;color:inherit;opacity:.9}
body[data-alert=caution] .lamp.c{background:var(--caution-bg);border-color:var(--caution-line);color:var(--caution)}
body[data-alert=warning] .lamp.w{background:var(--warn);border-color:var(--warn);color:#fff;animation:pulse1 1.1s ease-out 2}
@keyframes pulse1{0%{box-shadow:0 0 0 0 rgba(196,36,32,.55)}100%{box-shadow:0 0 0 10px rgba(196,36,32,0)}}
.focus{gap:8px}
.focus .pill{font:700 10px/1 var(--mono);padding:6px 8px;background:var(--ink);color:#fff;letter-spacing:.04em}
.focus .pill.menu{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.focus .pill.comms{background:var(--comms)}
.feed{gap:7px;color:var(--ink3);font:500 10.5px var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pet);display:inline-block}

/* ───────── layout ───────── */
main{display:grid;grid-template-columns:clamp(244px,19.2vw,330px) minmax(0,1fr) clamp(332px,25.6vw,480px);gap:8px;padding:8px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.ph{height:25px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line2)}
.ph .ix{font:500 9.5px var(--mono);color:var(--ink4)}
.ph .t{font:700 10px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.ph .meta{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink3);white-space:nowrap}
.ph .fk{font:600 9px/1 var(--mono);color:var(--ink3);border:1px solid var(--line);padding:2px 3px;border-radius:2px;background:#fff}
.pb{padding:9px 10px;min-height:0}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--ink5) transparent}

/* ───────── vitals ───────── */
.gauge{margin-bottom:9px}
.gauge:last-child{margin-bottom:0}
.g-row{display:flex;align-items:baseline;gap:6px}
.g-row .lbl{width:22px}
.g-val{font:700 22px/1 var(--mono);letter-spacing:-.04em}
.g-max{font:500 12px var(--mono);color:var(--ink3)}
.g-pct{margin-left:auto;font:600 10.5px var(--mono);color:var(--ink3)}
.g-state{font:700 9.5px/1 var(--sans);letter-spacing:.08em;padding:3px 5px;border:1px solid var(--line);color:var(--ink3)}
.bar{position:relative;height:8px;background:var(--well);border:1px solid var(--line);margin-top:5px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar .tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink4)}
.bar-sm{height:6px}
.ticks{position:relative;height:11px;font:500 8px/11px var(--mono);color:var(--ink4);letter-spacing:-.02em}
.ticks span{position:absolute;transform:translateX(-50%)}
.spark{display:block;width:100%;height:36px;margin-top:4px}
.trend{display:flex;justify-content:space-between;font:500 9.5px var(--mono);color:var(--ink4);margin-top:1px}
.trend b{font-weight:600;color:var(--ink3)}
.hp.caution .g-val,.hp.caution .g-state{color:var(--caution)} .hp.caution .bar i{background:var(--caution-hi)}
.hp.caution .g-state{border-color:var(--caution-line);background:var(--caution-bg)}
.hp.warning{background:var(--warn-bg);margin:-9px -10px 9px;padding:9px 10px;border-bottom:1px solid var(--warn-line)}
.hp.warning .g-val{color:var(--warn)} .hp.warning .bar i{background:var(--warn)} .hp.warning .bar{border-color:var(--warn-line);background:#fff}
.hp.warning .g-state{background:var(--warn);border-color:var(--warn);color:#fff}
.hp.warning .trend b{color:var(--warn)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* scales + annunciator */
.scale{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.scale span{font:600 8px/1 var(--sans);letter-spacing:.03em;text-align:center;padding:5px 0;background:var(--well);color:var(--ink4);border:1px solid var(--line3);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.scale span.on{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.scale span.on.cau{background:var(--caution-bg);color:var(--caution);border-color:var(--caution);box-shadow:inset 0 -2px 0 var(--caution)}
.scale span.on.wrn{background:var(--warn);color:#fff;border-color:var(--warn);box-shadow:none}
.ann{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:4px}
.ann span{font:700 8.5px/1 var(--mono);text-align:center;padding:5px 0;border:1px solid var(--line3);color:var(--ink5);background:var(--panel);letter-spacing:.02em}
.ann span.on.crit{background:var(--warn);border-color:var(--warn);color:#fff}
.ann span.on.cau{background:var(--caution-bg);border-color:var(--caution);color:var(--caution)}
.ann span.on.inf{background:var(--peace-bg);border-color:var(--peace);color:var(--peace)}
.sub-h{display:flex;justify-content:space-between;align-items:baseline}
.sub-h em{font:500 10px var(--mono);font-style:normal;color:var(--ink3)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.attrs div{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px 0 5px;text-align:center}
.attrs div label{display:block;font:600 8.5px/1 var(--sans);letter-spacing:.08em;color:var(--ink3)}
.attrs div b{display:block;font:600 14px/1.2 var(--mono);margin-top:2px}
.attrs div.w2{grid-column:span 2}

/* dungeon ladder */
.ladder{display:flex;flex-direction:column;gap:5px}
.dg-h{font:700 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:4px 0 1px;display:flex;align-items:center;gap:6px}
.dg-h:after{content:'';flex:1;height:1px;background:var(--line2)}
.lv{display:grid;grid-template-columns:24px auto 1fr;gap:7px;align-items:center;cursor:pointer;padding:2px;border:1px solid transparent}
.lv:hover{border-color:var(--line)}
.lv.cur{border-color:var(--ink);background:#fff}
.lv.viewing{border-color:var(--comms);background:var(--comms-bg)}
.lv .d{font:700 13px/1 var(--mono);text-align:right}
.lv .d small{display:block;font:500 8.5px var(--mono);color:var(--ink4);margin-top:2px}
.lv canvas{display:block;border:1px solid var(--line2);background:var(--paper)}
.lv .ann2{font:500 10px/1.3 var(--sans);color:var(--ink2);min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.lv .ann2 .tag{display:inline-block;font:600 8.5px/1 var(--mono);padding:2px 3px;border:1px solid var(--line);color:var(--ink2);background:#fff;white-space:nowrap}
.lv .ann2 .you{background:var(--ink);color:#fff;border-color:var(--ink)}
.lv.branch{margin-left:14px;position:relative}
.lv.branch:before{content:'';position:absolute;left:-10px;top:-8px;bottom:50%;border-left:1px solid var(--ink4);border-bottom:1px solid var(--ink4);width:8px}

/* ───────── map ───────── */
#mapPanel{flex:none}
body[data-alert=warning] #mapPanel{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.alertstrip{display:none;height:24px;align-items:center;gap:10px;padding:0 10px;font:600 11px var(--sans);flex:none}
body[data-alert=warning] .alertstrip.w{display:flex;background:var(--warn);color:#fff}
.alertstrip .sym{font:800 11px var(--mono)}
.alertstrip .sep{opacity:.5}
.alertstrip.info{display:flex;background:var(--well);color:var(--ink2);border-bottom:1px solid var(--line2)}
.topline{height:28px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 0;border-bottom:1px solid var(--line2);font:500 13px var(--mono);background:#fff;position:relative}
.topline .tl-t{width:44px;flex:none;text-align:right;font:500 10px var(--mono);color:var(--ink4);padding-right:8px;border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;justify-content:flex-end}
.topline .tl-m{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topline.ask{background:var(--ink);color:#fff}
.topline.ask .tl-t{color:#9b98a0;border-color:#333}
.topline.ask .tl-m{color:#fff;font-weight:700}
.topline.more{box-shadow:inset 3px 0 0 var(--ink)}
.topline.more .tl-m{color:var(--ink);font-weight:600}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;font:700 11px/1 var(--mono);border:1px solid var(--ink3);border-bottom-width:2px;border-radius:3px;background:#fff;color:var(--ink)}
.topline.ask .kc{background:#26262b;color:#fff;border-color:#55545c}
.topline.ask .kc.def{background:#fff;color:var(--ink);border-color:#fff}
.opt{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--sans);color:#c9c7cf;margin-left:4px}
.advice{margin-left:auto;display:inline-flex;gap:6px;align-items:center;font:600 10px var(--sans);letter-spacing:.06em;color:#c3c8ff;border:1px solid #4b52a8;padding:3px 7px;white-space:nowrap}
.morekey{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 10px var(--sans);letter-spacing:.1em;color:var(--ink)}
.morekey .kc{animation:blink 1.2s steps(2) infinite;background:var(--ink);color:#fff;border-color:var(--ink)}
@keyframes blink{50%{background:#fff;color:var(--ink)}}
.mapwrap{position:relative;padding:4px 10px 6px 0;background:var(--paper);overflow:hidden}
.ruler-x{display:flex;margin-left:44px;height:14px;font:500 8.5px/14px var(--mono);color:var(--ink4)}
.ruler-x span{width:var(--cw);flex:none;position:relative;text-align:left;overflow:visible;white-space:nowrap}
.ruler-x span.t5:after{content:'';position:absolute;left:calc(var(--cw)/2);bottom:0;height:3px;border-left:1px solid var(--ink5)}
.ruler-x span.t10:after{height:5px;border-color:var(--ink4)}
.ruler-x span.hx{color:var(--comms);font-weight:700}
.ruler-x span.hx:after{content:'▾';border:0;left:calc(var(--cw)/2 - 3.5px);bottom:-3px;height:auto;font-size:8px;color:var(--comms)}
.maprows{position:relative}
.mrow{display:flex;height:var(--rh);align-items:center}
.mrow .ry{width:44px;flex:none;text-align:right;padding-right:10px;font:500 8.5px var(--mono);color:var(--ink5)}
.mrow .ry.r5{color:var(--ink4)}
.mrow .ry.hy{color:var(--comms);font-weight:700}
.mrow .c{width:var(--cw);height:var(--rh);flex:none;text-align:center;font:400 var(--mfs)/var(--rh) var(--mono);white-space:pre;position:relative;cursor:crosshair}
.c.b{font-weight:700}
.c.mh{background:#FBE1DD} .c.mt{background:#DCEFD9} .c.mp{background:#E1E8F5}
.c.adj{box-shadow:inset 0 0 0 1.5px var(--warn);background:#F9CFC8}
.c.hero{box-shadow:inset 0 0 0 1.5px var(--ink)}
.c.hov{box-shadow:inset 0 0 0 1.5px var(--comms)!important;background:var(--comms-bg)!important}
.c.pin{box-shadow:inset 0 0 0 2px var(--comms)!important;background:var(--comms-bg)!important}
.xh{position:absolute;pointer-events:none;background:rgba(42,59,184,.045)}
.dim .mrow .c{opacity:.32}
.dim .mrow .c.keep{opacity:1}
.memtag{position:absolute;right:12px;top:6px;font:700 10px var(--sans);letter-spacing:.1em;color:var(--comms);background:var(--comms-bg);border:1px solid var(--comms-line);padding:4px 7px}
.mfoot{height:26px;flex:none;display:flex;align-items:center;border-top:1px solid var(--line2);font:500 11px var(--mono);color:var(--ink2);background:#fff}
.mfoot>div{padding:0 10px;height:100%;display:flex;align-items:center;gap:8px;border-right:1px solid var(--line3);white-space:nowrap;overflow:hidden}
.mfoot .insp{flex:1;min-width:0}
.mfoot .insp .g{font-weight:700;font-size:13px;width:12px;text-align:center}
.mfoot .insp .rel{color:var(--comms);font-weight:600}
.mfoot .under{flex:0 1 auto;max-width:46%;border-right:0!important}
.ph .lgd{display:flex;gap:10px;margin-left:14px;font:500 10px var(--sans);color:var(--ink3)}
.sw{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.12)}

/* overlays: menu + text window */
.ovl{position:absolute;background:#fff;border:1.5px solid var(--ink);box-shadow:0 10px 30px rgba(20,20,30,.16),0 1px 0 rgba(0,0,0,.05);display:flex;flex-direction:column;z-index:5}
.ovl .oh{display:flex;align-items:center;gap:8px;padding:0 12px;height:28px;background:var(--ink);color:#fff}
.ovl .oh .t{font:700 10px var(--sans);letter-spacing:.11em;text-transform:uppercase}
.ovl .oh .meta{margin-left:auto;font:500 10.5px var(--mono);color:#b9b7bf}
.ovl .q{padding:10px 14px 8px;font:700 14px var(--sans);border-bottom:1px solid var(--line2)}
.ovl .items{padding:4px 0}
.ovl .it{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:0 14px;height:27px;font:500 13px var(--sans)}
.ovl .it:hover,.ovl .it.sel{background:var(--comms-bg)}
.ovl .it .tag{font:600 9px var(--mono);color:var(--comms);letter-spacing:.04em}
.ovl .of{display:flex;gap:14px;align-items:center;padding:8px 14px;border-top:1px solid var(--line2);font:500 10.5px var(--sans);color:var(--ink3);background:var(--well)}
.ovl .of span{display:inline-flex;gap:5px;align-items:center}
.ovl .of .kc{height:17px;min-width:17px;font-size:10px}
.tw{font:400 12px/17px var(--mono);padding:8px 16px;columns:2;column-gap:28px;column-rule:1px solid var(--line2);flex:1;overflow:hidden;column-fill:auto}
.tw div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;break-inside:avoid}
.tw .h{font:700 10px/17px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--line2);margin-bottom:2px}
.tw .pre{color:var(--ink4)}
.tw .lead{color:var(--ink3);font-family:var(--sans);font-size:11.5px;column-span:all;margin-bottom:6px}

/* ───────── messages + contacts ───────── */
.lower{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:8px;flex:1;min-height:0}
.msgs{font:500 12px/1.35 var(--sans)}
.msg{display:grid;grid-template-columns:40px 3px 1fr;gap:8px;padding:2.5px 10px 2.5px 0;align-items:baseline}
.msg .tn{font:500 10px var(--mono);color:var(--ink4);text-align:right}
.msg .k{align-self:stretch;background:transparent}
.msg.dmg .k{background:var(--warn)} .msg.pet .k{background:var(--pet)} .msg.q .k{background:var(--ink5)}
.msg.old{color:var(--ink3)}
.msg.now{font-weight:600}
.msg .x{font:600 10px var(--mono);color:var(--ink3);margin-left:4px}
.msg.q .tx{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.msg.sep{border-top:1px solid var(--line3)}
.tbl{width:100%;border-collapse:collapse;font:500 11.5px var(--sans)}
.tbl td,.tbl th{padding:3px 6px;border-bottom:1px solid var(--line3);white-space:nowrap;text-align:left}
.tbl th{font:700 8.5px var(--sans);letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;background:var(--well);padding-top:4px;padding-bottom:4px}
.tbl td.g{font:700 13px var(--mono);text-align:center;width:22px}
.tbl td.n{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink2)}
.tbl td.nm{white-space:normal}
.tbl tr.sect td{font:700 9px var(--sans);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;padding-top:7px;border-bottom:1px solid var(--line2);background:var(--panel)}
.disp{font:700 8.5px/1 var(--mono);padding:2px 4px;letter-spacing:.04em;border:1px solid}
.disp.h{color:var(--warn);border-color:var(--warn-line);background:#fff}
.disp.t{color:var(--pet);border-color:#A7CDA5;background:#fff}
.disp.p{color:var(--peace);border-color:#AFC0E2;background:#fff}
tr.adjrow td{background:var(--warn-bg)}
tr.adjrow .disp.h{background:var(--warn);color:#fff;border-color:var(--warn)}
.empty{padding:14px 10px;color:var(--ink3);font:500 11px var(--sans)}

/* ───────── comms ───────── */
#comms{flex:1.12 1 0;min-height:300px}
.chstate{font:700 9.5px/1 var(--mono);letter-spacing:.06em;padding:4px 6px;border:1px solid var(--line);color:var(--ink3);display:inline-flex;gap:5px;align-items:center}
.chstate .led{width:6px;height:6px;border-radius:50%;background:var(--ink5)}
.chstate.listening{color:var(--comms);border-color:var(--comms-line)} .chstate.listening .led{background:var(--comms)}
.chstate.speaking{background:var(--comms);border-color:var(--comms);color:#fff} .chstate.speaking .led{background:#fff;animation:blink2 .8s infinite}
@keyframes blink2{50%{opacity:.25}}
.vox{display:grid;grid-template-columns:34px 1fr auto;gap:4px 8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);background:#fff}
.vox .lbl{font-size:8.5px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{flex:1;background:var(--line);height:var(--h);min-height:2px;border-radius:1px}
.wave.mic.on i{background:var(--ink4)}
.wave.ast.live i{background:var(--comms);animation:wv .9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wv{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.vox .st{font:600 9.5px var(--mono);color:var(--ink3);text-align:right;white-space:nowrap}
.vox .st.on{color:var(--comms)}
.caption{padding:10px 12px;border-bottom:1px solid var(--comms-line);background:var(--comms-bg);font:500 14px/1.42 var(--sans);color:#9196BC}
.caption .said{color:var(--ink)}
.caption .cur{color:var(--ink);background:linear-gradient(transparent 62%,#C9CFF7 62%)}
.caption .ch{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.trig{font:700 8.5px/1 var(--mono);letter-spacing:.05em;padding:3px 5px;background:var(--warn);color:#fff}
.trig.n{background:var(--comms)}
.tr{padding:4px 0}
.te{display:grid;grid-template-columns:38px 30px 1fr;gap:6px;padding:4px 10px 4px 0;font:500 12px/1.42 var(--sans);align-items:baseline}
.te .tn{font:500 10px var(--mono);color:var(--ink4);text-align:right}
.te .wh{font:700 9px var(--mono);letter-spacing:.04em;color:var(--ink3)}
.te.ast .wh{color:var(--comms)}
.te.you .tx{color:var(--ink2)}
.te.you .tx:before{content:'“';color:var(--ink4)} .te.you .tx:after{content:'”';color:var(--ink4)}
.te.sys .tx{font:500 10.5px var(--mono);color:var(--ink3)}
.te .via{font:500 9px var(--mono);color:var(--ink4);margin-left:5px}
.te.ast.livebox .tx{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;min-width:0}
.te>div{min-width:0}
.chip{font:500 9.5px/1 var(--mono);padding:3px 5px;border:1px solid var(--line);color:var(--ink3);background:#fff;white-space:nowrap;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:700;color:var(--ink2)}
.chip.open{border-color:var(--comms);color:var(--comms)}
.card{margin-top:5px;border:1px solid var(--comms-line);border-left:3px solid var(--comms);background:#fff;padding:6px 8px;font:500 11px/1.4 var(--sans)}
.card .h{display:flex;justify-content:space-between;font:600 9.5px var(--mono);color:var(--comms);margin-bottom:3px}
.card .h span{color:var(--ink4);font-weight:500}
.card ul{margin:0;padding-left:14px;color:var(--ink2)}
.gate{margin-top:5px;border:1px dashed var(--caution);background:var(--caution-bg);padding:5px 8px;display:flex;gap:8px;align-items:center;font:600 10.5px var(--sans);color:var(--caution)}
.gate .kc{height:17px;font-size:9.5px;border-color:var(--caution)}
.gate.done{opacity:.75}
.ask{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line2);background:#fff;flex:none}
.ask .in{flex:1;height:28px;border:1px solid var(--line);display:flex;align-items:center;padding:0 8px;color:var(--ink4);font:500 12px var(--sans);background:var(--panel)}
.ask .in.typing{border-color:var(--comms);color:var(--ink);box-shadow:0 0 0 2px var(--comms-bg)}
.ask .ptt{display:flex;align-items:center;gap:5px;font:600 10px var(--sans);color:var(--ink3);white-space:nowrap}

/* ───────── inventory ───────── */
#inv{flex:1 1 0;min-height:250px}
.tabs{display:flex;height:25px;border-bottom:1px solid var(--line2);flex:none}
.tabs button{all:unset;cursor:pointer;padding:0 10px;font:700 10px/25px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border-right:1px solid var(--line3)}
.tabs button b{font:600 10px var(--mono);color:var(--ink4);margin-left:5px;letter-spacing:0}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);background:#fff}
.tabs .meta{margin-left:auto;display:flex;align-items:center;padding-right:10px;gap:6px;font:500 10px var(--mono);color:var(--ink3)}
.equip{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:7px 8px;border-bottom:1px solid var(--line2);background:#fff}
.equip div{border:1px solid var(--line3);padding:3px 4px 4px;min-width:0}
.equip div label{display:block;font:700 7.5px/1 var(--sans);letter-spacing:.08em;color:var(--ink4);text-transform:uppercase}
.equip div b{display:block;font:600 11px/1.25 var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equip div.on{border-color:var(--ink4);background:var(--panel)}
.equip div.off b{color:var(--ink5);font-weight:500}
.itbl td{padding:3px 6px;height:22px}
.itbl td.l{font:700 11.5px var(--mono);width:22px;text-align:center;color:var(--ink)}
.itbl td.buc{font:600 9.5px var(--mono);width:16px;text-align:center;color:var(--ink3)}
.itbl td.buc.B{color:var(--pet)} .itbl td.buc.C{color:var(--warn)}
.itbl td.en{font:500 11px var(--mono);width:22px;text-align:right;color:var(--ink2)}
.itbl .nm .cn{font-style:italic;color:var(--ink3)}
.itbl .nm .chg{font:500 10px var(--mono);color:var(--ink3);margin-left:4px}
.st{font:700 8.5px/1 var(--mono);padding:2px 4px;letter-spacing:.04em;border:1px solid var(--line);color:var(--ink3);margin-left:3px;background:#fff}
.st.w{background:var(--ink);color:#fff;border-color:var(--ink)}
.st.u{color:var(--caution);border-color:var(--caution-line);background:repeating-linear-gradient(135deg,#fff 0 3px,var(--caution-bg) 3px 6px)}
.itbl tr.unid td.nm{color:var(--ink2)}

/* footer softkeys */
footer{display:flex;align-items:stretch;background:var(--ink);color:#d9d7de;font:500 10.5px var(--sans)}
.sk{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid #2c2c33;white-space:nowrap}
.sk kbd{font:700 9.5px/1 var(--mono);color:#fff;background:#2a2a31;border:1px solid #4a4a54;padding:3px 4px;border-radius:2px}
.demo{margin-left:auto;display:flex;align-items:center;gap:2px;padding:0 6px;background:#2a2a31}
.demo span{font:700 9px var(--sans);letter-spacing:.12em;color:#8f8d96;margin-right:6px}
.demo button{all:unset;cursor:pointer;font:600 10px var(--sans);padding:4px 7px;color:#bdbbc4;border:1px solid transparent}
.demo button.on{color:var(--ink);background:#fff}
.demo button:hover:not(.on){border-color:#55545c}
@media (max-width:1360px){
  main{grid-template-columns:232px minmax(0,1fr) 318px}
  .feed{display:none!important}
  .lamp{min-width:72px;padding:7px 6px}
  .ro{padding:0 11px}
  .sk{padding:0 7px}
  .demo button span{display:none}
  .who .sub{display:none}
  .lv canvas{width:118px!important;height:36px!important}
  .scale span{font-size:7px}
}
body[data-alert=caution] #condPanel{border-color:var(--caution);box-shadow:inset 0 3px 0 var(--caution-hi)}

<body data-alert="nominal">
<div id="app">
  <header id="top">
    <div class="who"><div class="brand">NH5</div><div><div class="name" id="hName"></div><div class="sub" id="hSub"></div></div></div>
    <div class="readouts" id="hRo"></div>

  </header>

  <main>
    <section class="col" id="colL">
      <div class="panel"><div class="ph"><span class="ix">01</span><span class="t">Vitals</span><span class="meta" id="vitMeta"></span></div>
        <div class="pb" id="vitals"></div></div>
      <div class="panel" id="condPanel"><div class="ph"><span class="ix">02</span><span class="t">Condition</span><span class="meta" id="condMeta"></span></div>
        <div class="pb" id="cond"></div></div>
      <div class="panel" style="flex:1"><div class="ph"><span class="ix">03</span><span class="t">Dungeon</span><span class="meta"><span class="fk">F6</span> browse</span></div>
        <div class="pb scroll" id="ladder" style="flex:1"></div></div>

    <section class="col" id="colC">
      <div class="panel" id="mapPanel">

        <div class="alertstrip w" id="warnStrip"></div>

        <div class="topline" id="topline"></div>
        <div class="mapwrap" id="mapwrap">
          <div class="ruler-x" id="rulerX"></div>

        </div>

      </div>
      <div class="lower">
        <div class="panel"><div class="ph"><span class="ix">05</span><span class="t">Message log</span><span class="meta" id="msgMeta"></span></div>
          <div class="scroll msgs" id="msgs" style="flex:1"></div></div>
        <div class="panel"><div class="ph"><span class="ix">06</span><span class="t">Contacts</span><span class="meta" id="conMeta"></span></div>
          <div class="scroll" id="contacts" style="flex:1"></div></div>
      </div>
    </section>

    <section class="col" id="colR">
      <div class="panel" id="comms">
        <div class="ph"><span class="ix">07</span><span class="t">Comms · Assistant</span><span class="meta" id="chState"></span></div>
        <div class="vox" id="vox"></div>

        <div class="ask"><div class="in" id="askIn"><span class="fk" style="font:600 9px var(--mono);border:1px solid var(--line);padding:2px 3px;margin-right:7px;color:var(--ink3);background:#fff">F4</span>Type to the assistant…</div>
          <div class="ptt"><span class="kc" style="height:17px;font-size:9.5px">F2</span>hold to talk</div></div>
      </div>

  <footer>

    <div class="sk"><kbd>F2</kbd>Talk (hold)</div>

</div>

<script>
const DATA = /*__DATA__*/null;

/* NetHack colour index → light-paper ink. Bright colours also get bold weight. */
const NHC = ['#2A2A2A','#C1271D','#2B7A2B','#8A5A14','#2342B5','#8E2C8A','#007F8A','#57534B',
             '#8C877D','#C25400','#13892C','#9A6E00','#1660E0','#BE1AAE','#008A9E','#141414'];
const DARKFLOOR = '#C4BEB2';

/* ───────── mockup states ───────── */
const AUG_D4 = [ // plausible extra lines for the magic-mapped descent (fixture has only the welcome)
  {turn:2,text:'A map coalesces in your mind!'},{turn:7,text:'A map coalesces in your mind!'},
  {turn:9,text:'A map coalesces in your mind!'},{turn:10,text:'A map coalesces in your mind!'},
  {turn:11,text:'There is a staircase up here.'}];
const STATES = [
 {key:'nominal', label:'1 Nominal', fx:'deep-dlvl4', alert:'nominal', augment:AUG_D4,
  hp:[16,16,16,16,16,15,15,15,15,15,15], pw:[2,2,2,2,2,2,2,2,2,2,2],
  comms:{mode:'listening', mic:true, t:[
    {t:10,w:'you',via:'voice',x:'Where are the stairs down?'},
    {t:10,w:'ast',x:'Far southwest — 47 west, 12 south, in the bottom-left room. Quickest is travel: press _ then > then period.',chips:[['get_level_map','Dlvl 4']]},
    {t:11,w:'you',via:'voice',x:'Anything nasty on the way?'},
    {t:11,w:'ast',x:'Nothing in sight. There’s a teleport trap just outside the north wall, one step west of you — travel will route around it.',chips:[['get_level_map','Dlvl 4'],['look','66,2']]},
  ]}},
 {key:'caution', label:'2 Caution', fx:'hungry-conditions', alert:'caution',
  hp:[16,16,16,16,16,16,16,16,16,16,16,16], t0:762,
  info:'BLIND — map shows remembered terrain only · contacts unavailable',
  comms:{mode:'standby', mic:false, t:[
    {t:771,w:'sys',x:'caution raised · Conf'},
    {t:772,w:'sys',x:'caution raised · Blind'},
    {t:773,w:'you',via:'voice',x:'Why can’t I see anything?'},
    {t:773,w:'ast',x:'It’s the blindfold you just put on — R takes it off. You’re also Confused from the booze, and Hungry: eat the food ration with e, then d.',chips:[['get_status'],['get_inventory']]},
  ]}},
 {key:'warning', label:'3 Warning', fx:'low-hp', alert:'warning',
  hp:[16,15,15,15,12,10,6,5,5,5,4,4], pw:[2,2,2,2,2,2,2,2,2,2,2,2],
  comms:{mode:'speaking', mic:true, t:[
    {t:5,w:'you',via:'voice',x:'Orc or jackal first?'},
    {t:5,w:'ast',x:'Jackal — one good hit kills it. The kitten’s already on the orc.',chips:[['nethack_lookup','jackal','monsters.h'],['nethack_lookup','hill orc','monsters.h']]},
    {t:7,w:'ast',x:'Kitten got the orc.'},
    {t:12,w:'sys',x:'warning raised · HP 4/16 < ⅓'},
  ], live:{trigger:'AUTO · HP < ⅓',
    said:'Four hit points — careful. Don’t pray: it’s turn twelve, far too early, Odin won’t answer. ',
    cur:'The jackal’s adjacent, northeast,',
    rest:' and only bites for one or two. Finish it, or engrave Elbereth to scare it off.',
    chips:[['get_status'],['fetch_wiki_page','Prayer'],['nethack_lookup','jackal','monsters.h']]}}},
 {key:'menu', label:'4 Menu', fx:'menu-open', alert:'nominal', focus:'menu',
  hp:[11,11,11,11,11], pw:[9,5,5,4,4],
  comms:{mode:'listening', mic:true, t:[
    {t:4,w:'sys',x:'picked up p · scroll labeled ASHPD SODALG (unidentified)'},
    {t:5,w:'you',via:'typed',x:'how do i name this scroll so i remember it'},
    {t:5,w:'ast',x:'Press o — “the type of an object in inventory”. Then pick p and type a name. Every ASHPD SODALG scroll will show it from now on.',chips:[['get_inventory'],['get_screen','menu']]},
  ]}},
 {key:'yn', label:'5 y/n', fx:'fountain-quaff-prompt', alert:'nominal', focus:'prompt', advise:'n',
  hp:[11,11,11,11], pw:[9,5,5,4],
  comms:{mode:'listening', mic:true, t:[
    {t:4,w:'you',via:'voice',x:'Should I drink from this?'},
    {t:4,w:'ast',x:'I wouldn’t. Quaffing from fountains is mostly bad news at your level — water moccasins, a water demon, or a curse. Press n.',chips:[['nethack_lookup','fountain','fountain.c']]},
  ]}},
 {key:'inspect', label:'6 Inspect', fx:'shop', alert:'nominal', pin:[77,17], invTab:'inv',
  hp:[16,16,16], pw:[2,2,2],
  comms:{mode:'listening', mic:true, t:[
    {t:3,w:'you',via:'voice',x:'Is this fizzy potion worth buying?'},
    {t:3,w:'ast',x:'That needs price identification — a mild spoiler. Want it?',gate:true},
    {t:3,w:'you',via:'voice',x:'Yeah, go ahead.'},
    {t:3,w:'ast',x:'With Charisma 8 you pay a third extra, so 333 means a base of 250: acid or oil. I’d skip it.',
      chips:[['nethack_lookup','potion of acid','objects.h',1],['nethack_lookup','potion of oil','objects.h'],['fetch_wiki_page','Price identification']],
      card:{h:'potion of acid',src:'include/objects.h',l:['Base price 250 zorkmids. (price identification)','Generation probability 10 per 1000 of its class.','Weight 20, material glass.']}},
  ]}},
 {key:'more', label:'7 More', fx:'more-prompt', alert:'nominal', focus:'more',
  hp:[11,11,11,11,11,11], pw:[9,5,5,4,4,4],
  comms:{mode:'listening', mic:true, t:[
    {t:3,w:'you',via:'voice',x:'Can I pray to get my power back?'},
    {t:3,w:'ast',x:'I wouldn’t — it’s turn three, your prayer timeout is still high, and low power doesn’t count as trouble.',chips:[['fetch_wiki_page','Prayer']]},
    {t:6,w:'ast',auto:1,x:'Brace yourself — Anhur is speaking. Praying this early costs luck and angers him. Press Enter to read on.'},
  ]}},
 {key:'text', label:'8 Text win', fx:'deep-dlvl4', alert:'nominal', augment:AUG_D4, focus:'text', invTab:'disc',
  hp:[16,16,16,16,16,15,15,15,15,15,15], pw:[2,2,2,2,2,2,2,2,2,2,2],
  comms:{mode:'listening', mic:true, t:[
    {t:11,w:'you',via:'voice',x:'Have I identified anything useful yet?'},
    {t:11,w:'ast',x:'Not yet — that list is the weapon and armor names a Valkyrie knows from the start. Runed means elven, crude means orcish.',chips:[['get_discoveries']]},
  ]}},
];

/* ───────── helpers ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = (n,w) => String(n).padStart(w,' ');
function bearing(dx,dy){
  const r = Math.max(Math.abs(dx),Math.abs(dy));
  if(r===0) return {r:0,txt:'here'};
  const ns = dy<0?'N':dy>0?'S':'', ew = dx<0?'W':dx>0?'E':'';
  if(dx===0||dy===0||Math.abs(dx)===Math.abs(dy)) return {r, txt:`${r} ${ns}${ew}`};
  return {r, txt:`${Math.abs(dx)}${ew} ${Math.abs(dy)}${ns}`};
}
function cellStyle(ch,color,desc){
  if(ch==='.' && color===0) return {c:DARKFLOOR,b:false};
  return {c:NHC[color]||NHC[7], b:color>=9||color===15};
}
function isMonster(c,hero){
  const [x,y,ch,col,desc]=c;
  if(hero && x===hero.x && y===hero.y) return false;
  if(!/[A-Za-z@:;&'~]/.test(ch)) return false;
  if(/^(a|an|the|\d+)\s/.test(desc)) return false;
  return true;
}
function disp(desc){ return /^tame /.test(desc)?'t':/^peaceful /.test(desc)?'p':'h'; }
function alertOf(F){
  const f=F.status.fields, hp=+f.hp, mx=+f.hp_max, conds=F.status.conditions||[];
  const r = hp/mx;
  const lvl = (hp<6||r<1/3)?'warning':r<0.5?'caution':'nominal';
  return {hp,mx,r,lvl,conds};
}

let S, F, view = {level:null, tab:'inv', hover:null};

/* ───────── header ───────── */
function renderHeader(){
  const f=F.status.fields, g=F.game, L=F.levels[F.cur].info;
  $('#hName').textContent = f.title;
  $('#hSub').textContent = `${g.role} · ${g.race} · ${g.gender} · ${g.alignment}`.replace(/\b\w/g,m=>m.toUpperCase());
  $('#hRo').innerHTML = `
   <div class="ro"><label>Dlvl</label><span>${L.depth}<small>${L.dungeon.replace(/^The /,'')}</small></span></div>
   <div class="ro"><label>Turn</label><span>${f.time}</span></div>
   <div class="ro"><label>XL</label><span>${f.xp_level}<small>${f.exp_points} xp</small></span></div>
   <div class="ro"><label>AC</label><span>${f.ac}</span></div>
   <div class="ro"><label>Gold</label><span>${f.gold}</span></div>`;
  const a=alertOf(F); const cau=[];
  if(a.lvl==='caution') cau.push('HP');
  if(f.hunger) cau.push(f.hunger.toUpperCase());
  cau.push(...a.conds.map(c=>c.toUpperCase()));
  $('#lampC').textContent = cau.length? cau.slice(0,3).join(' · ') : '—';
  $('#lampW').textContent = S.alert==='warning'? `HP ${a.hp}/${a.mx}` : '—';
  const fp=$('#focusPill'); fp.className='pill';
  const fm={menu:['MENU','menu'],prompt:['PROMPT y/n','menu'],more:['--MORE--','menu'],text:['TEXT WINDOW','menu']}[S.focus];
  if(fm){fp.textContent=fm[0]; fp.classList.add(fm[1]);} else fp.textContent='GAME';
  $('#feedTxt').textContent = `feed · seq ${F.awaiting.seq}`;
}

/* ───────── vitals ───────── */
function spark(vals, mx, t0, warnLine){
  const W=240,H=36,n=vals.length; if(n<2) return '';
  const X=i=>2+i*(W-4)/(n-1), Y=v=>H-3-(v/mx)*(H-7);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const lo = Math.min(...vals), li = vals.lastIndexOf(vals[n-1]);
  const col = warnLine? 'var(--warn)':'var(--ink)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="HP over the last ${n} turns">
    <line x1="0" x2="${W}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line2)" stroke-width="1"/>
    <line x1="0" x2="${W}" y1="${Y(mx/3)}" y2="${Y(mx/3)}" stroke="${warnLine?'var(--warn-line)':'var(--line)'}" stroke-dasharray="3 3" stroke-width="1"/>
    <polygon points="2,${H} ${pts} ${W-2},${H}" fill="${warnLine?'rgba(196,36,32,.08)':'rgba(22,22,26,.05)'}"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(n-1)}" cy="${Y(vals[n-1])}" r="3.2" fill="${col}" stroke="#fff" stroke-width="1.5"/>

/* ───────── dungeon ladder ───────── */
function thumb(level, isCur, hero){
  const s=1.75, sy=2, c=document.createElement('canvas'); const dpr=2;
  c.width=80*s*dpr; c.height=21*sy*dpr; c.style.width=80*s+'px'; c.style.height=21*sy+'px';
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  for(const [x,y,ch,col,desc] of level.cells){
    let fill;
    if(ch==='.') fill = col===0?'#E4E0D7':'#CBC6BB';
    else if(ch==='#'&&desc==='corridor') fill='#A7A296';
    else if(ch==='-'||ch==='|') fill = col===3?'#8A5A14':'#5E5A52';
    else if(ch==='+') fill='#8A5A14';
    else if(ch==='>'||ch==='<') fill='#2342B5';
    else if(ch==='{') fill='#1660E0';
    else if(ch==='^') fill='#BE1AAE';
    else if(ch==='$') fill='#C9A227';
    else fill='#7A766D';
    g.fillStyle=fill; g.fillRect(x*s,y*sy,s,sy);
    if(ch==='>'||ch==='<'){g.fillRect(x*s-1,y*sy-1,s+2,sy+2);}
  }
  if(isCur&&hero){g.fillStyle='#C42420';g.fillRect(hero.x*s-2,hero.y*sy-2,s+4,sy+4);g.fillStyle='#fff';g.fillRect(hero.x*s,hero.y*sy,s,sy);}
  return c;
}
function overviewNotes(){
  const notes={}; let dg=null, lv=null;
  for(const line of F.overview){
    let m;
    if(!/^\s/.test(line)){ dg=line.replace(/:.*$/,''); lv=null; continue; }
    if((m=line.match(/^\s+Level (\d+):(.*)$/))){ lv=+m[1]; const k=dg+'|'+lv; notes[k]=notes[k]||[]; if(/You are here/.test(m[2])) notes[k].here=1; continue; }
    if(lv!=null){ notes[dg+'|'+lv].push(line.trim()); }
  }
  return notes;
}
function noteTag(n){
  if(/general store/i.test(n)) return 'SHOP·GEN';
  if(/scroll shop/i.test(n)) return 'SHOP·SCR';
  if(/Gnomish Mines/i.test(n)) return '▸MINES';
  if(/fountain/i.test(n)) return 'FOUNT';
  return n.replace(/\.$/,'').slice(0,8).toUpperCase();
}
function renderLadder(){
  const notes=overviewNotes(), el=$('#ladder'); el.innerHTML='';
  const keys=Object.keys(F.levels).sort((a,b)=>F.levels[a].info.depth-F.levels[b].info.depth || F.levels[a].info.dnum-F.levels[b].info.dnum);
  const box=document.createElement('div'); box.className='ladder';
  let lastDg=null;
  for(const k of keys){
    const L=F.levels[k], I=L.info, branch=I.dnum!==0, isCur=k===F.cur;
    if(!branch && lastDg!=='dod'){ const h=document.createElement('div'); h.className='dg-h'; h.textContent='Dungeons of Doom'; box.appendChild(h); lastDg='dod'; }
    const row=document.createElement('div'); row.className='lv'+(isCur?' cur':'')+(branch?' branch':'')+(view.level===k&&!isCur?' viewing':'');

      <td><span class="disp ${d}">${{h:'HOSTILE',t:'TAME',p:'PEACEFUL'}[d]}</span></td><td class="n">${b.r}</td><td class="n">${b.txt}</td></tr>`;
  }
  h+=`<tr class="sect"><td colspan="5">Waypoints · this level</td></tr>`;
  for(const {c,b} of wp){
    const st=cellStyle(c[2],c[3],c[4]);
    h+=`<tr><td class="g" style="color:${st.c}">${esc(c[2])}</td><td class="nm" colspan="2">${esc(c[4])}</td><td class="n">${b.r}</td><td class="n">${b.txt}</td></tr>`;
  }
  if(!wp.length) h+=`<tr><td colspan="5" class="empty">None known.</td></tr>`;
  h+='</tbody></table>';
  $('#contacts').innerHTML=h;
  const nh=mons.filter(m=>disp(m.c[4])==='h').length;
  $('#conMeta').innerHTML= blind?'—':`${mons.length} in view${nh?` · <b style="color:var(--warn)">${nh} hostile</b>`:''}`;
}

/* ───────── comms ───────── */
const ICON_MIC='<svg width="8" height="10" viewBox="0 0 8 10" style="vertical-align:-1px;margin-right:3px"><rect x="2.2" y="0.5" width="3.6" height="6" rx="1.8" fill="none" stroke="currentColor"/><path d="M0.8 4.6a3.2 3.2 0 0 0 6.4 0M4 7.8v1.7" fill="none" stroke="currentColor"/></svg>';
const ICON_KB='<svg width="11" height="8" viewBox="0 0 11 8" style="vertical-align:-0.5px;margin-right:3px"><rect x="0.5" y="0.5" width="10" height="7" rx="1" fill="none" stroke="currentColor"/><path d="M2.5 5.5h6M2.5 3h1M5 3h1M7.5 3h1" stroke="currentColor"/></svg>';
function waveBars(n,seed,live){
  let s=seed, h='';
  for(let i=0;i<n;i++){ s=(s*9301+49297)%233280; const r=s/233280;
    const env=live?0.35+0.65*Math.sin(Math.PI*i/n):(seed===7?0.32:0.16); const v=Math.max(0.1,env*(0.35+0.65*r));
    h+=`<i style="--h:${(v*100).toFixed(0)}%;--d:${(-r*0.9).toFixed(2)}s"></i>`; }
  return h;
}
function chip(c,open){ return `<span class="chip ${open?'open':''}">⌕ <b>${esc(c[0])}</b>${c[1]?' '+esc(c[1]):''}${c[2]?' → '+esc(c[2]):''}</span>`; }
function renderComms(){
  const C=S.comms, mode=C.mode;
  const lbl={listening:'LISTENING',standby:'MIC OFF',speaking:'SPEAKING',thinking:'THINKING'}[mode];
  $('#chState').innerHTML=`<span class="chstate ${mode}"><span class="led"></span>${lbl}</span>`;
  $('#vox').innerHTML=`
    <span class="lbl">You</span><div class="wave mic ${C.mic?'on':''}">${waveBars(44,7,false)}</div><span class="st ${C.mic?'on':''}">${C.mic?'MIC OPEN · F3':'MUTED · F3'}</span>
    <span class="lbl">Asst</span><div class="wave ast ${mode==='speaking'?'live':''}">${waveBars(44,3,mode==='speaking')}</div><span class="st ${mode==='speaking'?'on':''}">${mode==='speaking'?'0:06 / 0:14':'idle'}</span>`;
  const cap=$('#caption');
  if(C.live){ const L=C.live;
    cap.innerHTML=`<div class="caption"><div class="ch"><span class="trig">${esc(L.trigger)}</span><span style="font:600 10px var(--mono);color:var(--comms)">T${F.turn} · speaking</span>
      <span style="margin-left:auto;font:600 9.5px var(--mono);color:var(--ink3)"><span class="kc" style="height:16px;font-size:9px">F2</span> interrupt</span></div>
      <span class="said">${esc(L.said)}</span><span class="cur">${esc(L.cur)}</span>${esc(L.rest)}
      <div class="chips">${L.chips.map(c=>chip(c)).join('')}</div></div>`;
  } else cap.innerHTML='';
  let h='';
  for(const e of C.t){
    h+=`<div class="te ${e.w}"><span class="tn">T${e.t}</span><span class="wh">${{you:'YOU',ast:'ASST',sys:'SYS'}[e.w]}</span><div><span class="tx">${esc(e.x)}</span>${e.via?`<span class="via">${e.via==='voice'?ICON_MIC+'voice':ICON_KB+'typed'}</span>`:''}${e.auto?'<span class="trig n" style="margin-left:6px">AUTO</span>':''}
      ${e.gate?`<div class="gate done"><span>⚑ SPOILER GATE · price identification</span><span style="margin-left:auto;font:500 10px var(--mono)">allowed by voice</span><span class="kc">F8</span></div>`:''}
      ${e.chips?`<div class="chips">${e.chips.map(c=>chip(c,c[3])).join('')}</div>`:''}
      ${e.card?`<div class="card"><div class="h">${esc(e.card.h)}<span>${esc(e.card.src)}</span></div><ul>${e.card.l.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`:''}
    </div></div>`;
  }
  const tr=$('#transcript'); tr.innerHTML=h; tr.scrollTop=tr.scrollHeight;
}

/* ───────── inventory ───────── */
const CLASS_ORDER=['weapons','armor','food','scrolls','spellbooks','potions','rings','wands','tools','amulets','gems'];
const CLASS_NAME={food:'Comestibles'};
function parseItem(it){
  let t=it.text, tag=[], chg='', called='';
  const pm=t.match(/\s\(([^)]*)\)$/);
  if(pm){ const p=pm[1]; t=t.slice(0,pm.index);
    if(/^\d+:\d+$/.test(p)) chg=p;
    else if(/weapon in/.test(p)) tag.push(['WIELD','w']);
    else if(/alternate/.test(p)) tag.push(['ALT','']);
    else if(/being worn/.test(p)) tag.push(['WORN','w']);
    else if(/quiver/.test(p)) tag.push(['QUIV','']); }
  t=t.replace(/^(a|an|the)\s+/,'');
  let buc='', en='';
  let m=t.match(/^(blessed|uncursed|cursed)\s+/); if(m){buc=m[1][0].toUpperCase(); t=t.slice(m[0].length);}
  m=t.match(/^([+-]\d+)\s+/); if(m){en=m[1]; t=t.slice(m[0].length);}
  m=t.match(/\scalled\s(.*)$/); if(m){called=m[1]; t=t.slice(0,m.index);}
  const magic=['potions','scrolls','rings','wands','amulets','spellbooks'].includes(it.class);
  const unid = magic && (!/ of /.test(t) || /labeled/.test(t)) && !/holy water|unholy water/.test(t);
  if(unid) tag.push(['UNID','u']);
  return {t,buc,en,tag,chg,called,unid};
}
function renderInv(){
  const tab=view.tab, inv=F.inventory, nd=F.discoveries.filter(l=>/^[*\s] /.test(l)).length;
  $('#tabs').innerHTML=`<button class="${tab==='inv'?'on':''}" data-t="inv">Inventory<b>${inv.length}</b></button><button class="${tab==='disc'?'on':''}" data-t="disc">Discoveries<b>${nd}</b></button>
    <span class="meta"><span class="fk" style="font:600 9px var(--mono);border:1px solid var(--line);padding:2px 3px;background:#fff">F5</span>switch</span>`;
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{view.tab=b.dataset.t;renderInv();});
  const body=$('#invBody');
  if(tab==='disc'){
    const lines=F.discoveries.slice(2);
    let h='<table class="tbl"><tbody>';
    for(const l of lines){ if(!/^[*\s] /.test(l)){ h+=`<tr class="sect"><td colspan="2">${esc(l)}</td></tr>`; continue; }
      const m=l.match(/^([*\s])\s(.*?)\s\((.*)\)$/); if(!m) continue;
      h+=`<tr><td class="nm" style="font-weight:600">${esc(m[2])}</td><td style="color:var(--ink3)">${esc(m[3])}${m[1]==='*'?' <span style="font:500 9px var(--mono);color:var(--ink4)">· pre</span>':''}</td></tr>`; }
    body.innerHTML=h+'</tbody></table>'; return;
  }
  const slotMap={}; for(const it of inv) for(const s of it.slots) slotMap[s]=it.letter;
  const SL=[['Weapon','wielded'],['Alt','alternate'],['Quiver','quiver'],['Shield','shield'],['Body','suit'],['Cloak','cloak'],
            ['Helm','helmet'],['Gloves','gloves'],['Boots','boots'],['Ring L','left_ring'],['Ring R','right_ring'],['Eyes','eyewear']];
  let h=`<div class="equip">${SL.map(([n,k])=>`<div class="${slotMap[k]?'on':'off'}"><label>${n}</label><b>${slotMap[k]||'—'}</b></div>`).join('')}</div>`;
  h+='<table class="tbl itbl"><tbody>';
  const groups={}; for(const it of inv) (groups[it.class]=groups[it.class]||[]).push(it);
  for(const cl of CLASS_ORDER.concat(Object.keys(groups).filter(k=>!CLASS_ORDER.includes(k)))){
    const g=groups[cl]; if(!g) continue;
    const nu=g.filter(i=>parseItem(i).unid).length;
    h+=`<tr class="sect"><td colspan="2">${esc(g[0].class_sym)}&nbsp; ${esc(CLASS_NAME[cl]||cl)}</td><td colspan="3" style="text-align:right">${g.length}${nu?` · <span style="color:var(--caution)">${nu} unid</span>`:''}</td></tr>`;
    for(const it of g){ const p=parseItem(it);
      h+=`<tr class="${p.unid?'unid':''}"><td class="l">${it.letter}</td><td class="buc ${p.buc}" title="${{B:'blessed',U:'uncursed',C:'cursed'}[p.buc]||'BUC unknown'}">${p.buc||'·'}</td><td class="en">${p.en}</td>
        <td class="nm">${esc(p.t)}${p.called?` <span class="cn">“${esc(p.called)}”</span>`:''}${p.chg?`<span class="chg">${p.chg}</span>`:''}</td>
        <td style="text-align:right">${p.tag.map(([n,c])=>`<span class="st ${c}">${n}</span>`).join('')}</td></tr>`; }
  }
  body.innerHTML=h+'</tbody></table>';
}

/* ───────── wiring ───────── */
function render(i){
  S=STATES[i]; F=DATA[S.fx]; view.level=null; view.tab=S.invTab||'inv';
  document.body.dataset.alert=S.alert;
  document.querySelectorAll('#demo button').forEach((b,j)=>b.classList.toggle('on',j===i));
  fitMap(); renderHeader(); renderVitals(); renderCond(); renderLadder(); renderTopline(); renderMap(); renderMessages(); renderContacts(); renderComms(); renderInv();
  history.replaceState(null,'','#'+S.key);
}
const demo=$('#demo');
STATES.forEach((s,i)=>{ const b=document.createElement('button'); const [n,...r]=s.label.split(' '); b.innerHTML=`<b>${n}</b><span> ${r.join(' ')}</span>`; b.title=s.label; b.onclick=()=>render(i); demo.appendChild(b); });
document.addEventListener('keydown',e=>{
  if(/^[1-8]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){ render(+e.key-1); return; } // mockup-only switcher
  if(e.key==='F5'){ e.preventDefault(); view.tab=view.tab==='inv'?'disc':'inv'; renderInv(); }
  if(e.key==='F6'){ e.preventDefault(); const ks=Object.keys(F.levels).sort((a,b)=>F.levels[a].info.depth-F.levels[b].info.depth); const i=ks.indexOf(view.level||F.cur); view.level=ks[(i-1+ks.length)%ks.length]; if(view.level===F.cur) view.level=null; renderMap(); renderLadder(); }
  if(e.key==='F4'){ e.preventDefault(); $('#askIn').classList.add('typing'); const fp=$('#focusPill'); fp.className='pill comms'; fp.textContent='COMMS · Esc returns'; }
  if(e.key==='Escape'){ $('#askIn').classList.remove('typing'); view.level=null; renderHeader(); renderMap(); renderLadder(); }
});
window.addEventListener('resize',()=>{ fitMap(); renderMap(); });
const start=Math.max(0,STATES.findIndex(s=>'#'+s.key===location.hash));
document.fonts.ready.then(()=>render(start)); render(start);
</script>
</body>
